interface Media @key(fields: "id") {
  id: ID!
}

# Lifts Book.averageRating from schema "b" into a single default
# implementation for all implementers of Media.
type MediaReviews @partial(of: "Media") @key(fields: "id") {
  averageRating: Float! @override(from: "b")
}

type Query {
  mediaReviewsById(id: ID!): MediaReviews @lookup @internal
}
